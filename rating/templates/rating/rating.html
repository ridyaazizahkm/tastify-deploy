<!-- Rating Section -->
<div class="flex items-center flex-wrap gap-3 mt-4 mb-4 border-t pt-4 border-stone-100">
    <div class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-amber-50/80 border border-amber-200/70 text-xs font-semibold">
        <span class="text-amber-500 text-sm leading-none">★</span>
        <span class="text-stone-900 font-bold leading-none">{{ average_rating }}</span>
        <span class="text-stone-500 font-normal leading-none">({{ total_ratings }} ulasan)</span>
    </div>
    {% if not user.is_staff and not user.is_superuser %}
    <button id="addRatingBtn" type="button" class="inline-flex items-center gap-1.5 bg-[#62191c] hover:bg-[#873632] text-white px-3.5 py-1.5 rounded-full text-xs font-semibold shadow-xs hover:shadow transition-all duration-200">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
        </svg>
        <span>Beri Rating</span>
    </button>
    {% endif %}
</div>

<!-- Rating Popup -->
<div id="ratingPopup" class="fixed inset-0 flex items-center justify-center bg-black/50 backdrop-blur-sm hidden z-50 p-4">
    <div class="bg-white p-6 rounded-2xl shadow-xl w-80 max-w-full border border-stone-100">
        <h3 class="text-base font-bold text-stone-900 mb-4 text-center">Rate this Recipe</h3>
        <div id="starContainer" class="flex justify-center mb-6 space-x-2 text-2xl">
        </div>
        <div class="flex justify-end space-x-2">
            <button id="cancelRatingBtn" class="px-4 py-2 border border-stone-200 rounded-xl text-stone-600 hover:bg-stone-50 text-xs font-semibold transition-colors">Cancel</button>
            <button id="submitRatingBtn" data-rating-url="{% url 'rating:add_rating' resep.id %}" class="px-4 py-2 bg-[#62191c] hover:bg-[#873632] text-white rounded-xl text-xs font-semibold shadow-sm transition-all">Submit</button>
        </div>
    </div>
</div>

<script>
    window.addEventListener('load', function() {
        // Rating functionality
        let selectedRating = 0;
        const ratingPopup = document.getElementById('ratingPopup');
        const addRatingBtn = document.getElementById('addRatingBtn');
        const cancelRatingBtn = document.getElementById('cancelRatingBtn');
        const submitRatingBtn = document.getElementById('submitRatingBtn');
        const starContainer = document.getElementById('starContainer');
        
        if (addRatingBtn) {
            addRatingBtn.addEventListener('click', function() {
                if (document.body.dataset.userAuthenticated !== 'true') {
                    if (typeof openLoginModal === 'function') {
                        openLoginModal('rating');
                    }
                    return;
                }
                ratingPopup.classList.remove('hidden');
                generateStars();
            });
        }
        
        if (cancelRatingBtn) {
            cancelRatingBtn.addEventListener('click', function() {
                ratingPopup.classList.add('hidden');
                selectedRating = 0;
            });
        }
        // Add this function to create a message alert
        function showMessageAlert(message, type = 'success') {
            const messageContainer = document.getElementById('message-container');
            
            if (!messageContainer) {
                // Create container if it doesn't exist
                const newContainer = document.createElement('div');
                newContainer.id = 'message-container';
                newContainer.className = 'fixed top-5 right-5 z-50 max-w-md';
                document.body.appendChild(newContainer);
                messageContainer = newContainer;
            }
            
            // Create the alert element
            const alertDiv = document.createElement('div');
            alertDiv.className = `message-alert bg-white border-l-4 ${type === 'success' ? 'border-green-500' : 'border-red-500'} p-4 mb-3 shadow-lg rounded-r flex items-start auto-dismiss`;
            alertDiv.role = 'alert';
            
            // Create the icon
            const iconDiv = document.createElement('div');
            iconDiv.className = 'flex-shrink-0 mr-3';
            const iconSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            iconSvg.setAttribute('class', `h-5 w-5 ${type === 'success' ? 'text-green-500' : 'text-red-500'}`);
            iconSvg.setAttribute('fill', 'none');
            iconSvg.setAttribute('viewBox', '0 0 24 24');
            iconSvg.setAttribute('stroke', 'currentColor');
            
            const iconPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            if (type === 'success') {
                iconPath.setAttribute('d', 'M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z');
            } else {
                iconPath.setAttribute('d', 'M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z');
            }
            iconPath.setAttribute('stroke-linecap', 'round');
            iconPath.setAttribute('stroke-linejoin', 'round');
            iconPath.setAttribute('stroke-width', '2');
            
            iconSvg.appendChild(iconPath);
            iconDiv.appendChild(iconSvg);
            
            // Create the message content
            const messageDiv = document.createElement('div');
            messageDiv.className = 'flex-1';
            const messageText = document.createElement('p');
            messageText.className = `font-medium ${type === 'success' ? 'text-green-800' : 'text-red-800'}`;
            messageText.textContent = message;
            messageDiv.appendChild(messageText);
            
            // Create the close button
            const closeButton = document.createElement('button');
            closeButton.className = 'ml-4 text-gray-400 hover:text-gray-600 focus:outline-none';
            closeButton.onclick = function() { alertDiv.remove(); };
            
            const closeSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            closeSvg.setAttribute('class', 'h-4 w-4');
            closeSvg.setAttribute('fill', 'none');
            closeSvg.setAttribute('viewBox', '0 0 24 24');
            closeSvg.setAttribute('stroke', 'currentColor');
            
            const closePath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            closePath.setAttribute('d', 'M6 18L18 6M6 6l12 12');
            closePath.setAttribute('stroke-linecap', 'round');
            closePath.setAttribute('stroke-linejoin', 'round');
            closePath.setAttribute('stroke-width', '2');
            
            closeSvg.appendChild(closePath);
            closeButton.appendChild(closeSvg);
            
            // Assemble the alert
            alertDiv.appendChild(iconDiv);
            alertDiv.appendChild(messageDiv);
            alertDiv.appendChild(closeButton);
            
            // Add to container
            messageContainer.appendChild(alertDiv);
            
            // Auto-dismiss after 5 seconds
            setTimeout(function() {
                alertDiv.remove();
            }, 5000);
        }

        // Modify the submitRatingBtn event listener to add success message
        if (submitRatingBtn) {
            submitRatingBtn.addEventListener('click', function() {
                if (selectedRating > 0) {
                    const ratingUrl = this.getAttribute('data-rating-url');
                    if (!ratingUrl) {
                        console.error("Rating URL not found");
                        alert("Error: Rating URL not found");
                        return;
                    }
                    
                    console.log("Submitting rating to:", ratingUrl);
                    
                    const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]');
                    
                    fetch(ratingUrl, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/x-www-form-urlencoded',
                            'X-CSRFToken': csrfToken.value
                        },
                        body: `score=${selectedRating}`
                    })
                    .then(response => response.json())
                    .then(data => {
                        console.log("Rating response:", data);
                        if (data.error) {
                            alert(data.error);
                            return;
                        }
                        
                        const ratingDisplay = document.querySelector('.flex.items-center .text-lg.font-semibold');
                        const totalRatingsDisplay = document.querySelector('.flex.items-center .text-sm.text-gray-500');
                        
                        if (ratingDisplay && totalRatingsDisplay) {
                            ratingDisplay.textContent = data.average_rating.toFixed(2);
                            totalRatingsDisplay.textContent = `(${data.total_ratings})`;
                        }
                        
                        // Show success message
                        showMessageAlert(`Your rating of ${selectedRating} star${selectedRating > 1 ? 's' : ''} has been added!`, 'success');
                        
                        ratingPopup.classList.add('hidden');
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showMessageAlert('Failed to add rating', 'error');
                    });
                } else {
                    alert('Please select a rating first');
                }
            });
        }
        
        function generateStars() {
            console.log("Generating stars");
            starContainer.innerHTML = '';
            for (let i = 1; i <= 5; i++) {
                const star = document.createElement('span');
                star.innerHTML = '★';
                star.classList.add('text-3xl', 'cursor-pointer', 'text-stone-300', 'hover:scale-110', 'transition-transform');
                star.dataset.rating = i;
                star.addEventListener('click', function() {
                    selectRating(i);
                });
                starContainer.appendChild(star);
            }
        }
        
        function selectRating(rating) {
            console.log("Star selected:", rating);
            selectedRating = rating;
            const stars = starContainer.querySelectorAll('span');
            stars.forEach(star => {
                const starRating = parseInt(star.dataset.rating);
                if (starRating <= rating) {
                    star.classList.remove('text-stone-300');
                    star.classList.add('text-amber-500');
                } else {
                    star.classList.remove('text-amber-500');
                    star.classList.add('text-stone-300');
                }
            });
        }
    });
</script>
